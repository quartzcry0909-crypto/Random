<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Smooth Hill Climb with Coins + Fuel + Sound</title>
<style>
html,body{margin:0;background:#87CEEB;overflow:hidden;font-family:Arial;}
canvas{display:block;}
#scoreboard{position:absolute;top:12px;left:12px;color:white;font-weight:bold;font-size:20px;text-shadow:0 2px 5px rgba(0,0,0,0.5);}
#fuelHud{position:absolute;top:12px;right:12px;width:170px;height:20px;background: rgba(255,255,255,0.18);border-radius:10px;overflow:hidden;box-shadow:0 2px 6px rgba(0,0,0,0.25);}
#fuelFill{height:100%;width:100%;background:linear-gradient(#76ff03,#64dd17);transition: width 0.1s linear, background 0.2s linear;}
.btn{position:absolute;bottom:20px;width:90px;height:90px;background:rgba(255,255,255,0.3);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:bold;color:#000;user-select:none;-webkit-user-select:none;}
#leftBtn{left:20px;} #rightBtn{left:130px;} #jumpBtn{right:20px;width:110px;height:110px;font-size:32px;}
</style>
</head>
<body>
<div id="scoreboard">Score: <span id="score">0</span></div>
<div id="fuelHud"><div id="fuelFill"></div></div>
<canvas id="game"></canvas>
<div id="leftBtn" class="btn">⟵</div>
<div id="rightBtn" class="btn">⟶</div>
<div id="jumpBtn" class="btn">⤒</div>
<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
function resize(){canvas.width=innerWidth;canvas.height=innerHeight;}
window.addEventListener("resize",resize);
resize();

let keys={};
document.addEventListener("keydown",e=>{keys[e.key]=true;if([" ","ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].includes(e.key))e.preventDefault();});
document.addEventListener("keyup",e=>keys[e.key]=false);
document.getElementById("leftBtn").addEventListener("touchstart",e=>{e.preventDefault();keys["ArrowLeft"]=true;});
document.getElementById("leftBtn").addEventListener("touchend",e=>{e.preventDefault();keys["ArrowLeft"]=false;});
document.getElementById("rightBtn").addEventListener("touchstart",e=>{e.preventDefault();keys["ArrowRight"]=true;});
document.getElementById("rightBtn").addEventListener("touchend",e=>{e.preventDefault();keys["ArrowRight"]=false;});
document.getElementById("jumpBtn").addEventListener("touchstart",e=>{e.preventDefault();keys[" "]=true;});
document.getElementById("jumpBtn").addEventListener("touchend",e=>{e.preventDefault();keys[" "]=false;});

let gravity=0.4;
const SEG_W=40;
const terrain=[];
for(let i=0;i<5000;i++){
    let lastY=terrain[i-1]?terrain[i-1].y:canvas.height*0.7;
    terrain.push({x:i*SEG_W,y:lastY+Math.sin(i*0.1)*2+(Math.random()-0.5)*1});
}

const car={x:100,y:terrain[3].y-100,vx:0,vy:0,angle:0,wheelDist:40,wheelRadius:22,grounded:false};
const coins=[]; for(let i=0;i<terrain.length;i+=8) coins.push({x:terrain[i].x+20+Math.random()*40,y:terrain[i].y-50-Math.random()*40,collected:false});
const barriers=[]; for(let i=20;i<terrain.length;i+=Math.floor(Math.random()*30)+25) barriers.push({x:terrain[i].x,y:terrain[i].y,w:40,h:50});
const fuels=[]; for(let i=10;i<terrain.length;i+=Math.floor(Math.random()*20)+10){ fuels.push({x:terrain[i].x+(Math.random()*30-15),y:terrain[i].y-50-Math.random()*30,collected:false}); }

function terrainY(px){let id=Math.floor(px/SEG_W); if(id<0||id>=terrain.length-1) return canvas.height; let p1=terrain[id],p2=terrain[id+1],t=(px-p1.x)/SEG_W; return p1.y*(1-t)+p2.y*t;}

let score=0,gameOver=false;
const MAX_FUEL=100; let fuel=MAX_FUEL; const PASSIVE_DECAY=0.0004,PRESS_CONSUME=0.12,JUMP_COST=6;

const scoreElem=document.getElementById("score"); const fuelFill=document.getElementById("fuelFill");
function updateHUD(){scoreElem.textContent=score;let pct=Math.max(0,Math.min(1,fuel/MAX_FUEL));fuelFill.style.width=(pct*100)+"%";fuelFill.style.background=(pct<0.2?"linear-gradient(#ff8a80,#ff5252)":pct<0.5?"linear-gradient(#ffd54f,#ffb300)":"linear-gradient(#76ff03,#64dd17)");}

// Images
const coinImg=new Image(); coinImg.src="1763475257303.png"; let coinImgReady=false; coinImg.onload=()=>coinImgReady=true;
const carImg=new Image(); carImg.src="1763474945768.png"; let carImgReady=false; carImg.onload=()=>carImgReady=true;
const fuelImg=new Image(); fuelImg.src="fuel.png"; let fuelImgReady=false; fuelImg.onload=()=>fuelImgReady=true;

// Sounds
const coinSnd=new Audio("coin.mp3"); const crashSnd=new Audio("crash.mp3");
const fuelSnd=new Audio("fuel.mp3"); const jumpSnd=new Audio("jump.mp3");
const emptyFuelSnd=new Audio("efuel.mp3");

let crashPlayed=false;

function updateCar(){
    if(gameOver) return;
    let canMove=fuel>0;
    
    if(keys["ArrowRight"]){ 
        if(canMove){ car.vx+=0.2; fuel-=PRESS_CONSUME; } 
        else { if(!emptyFuelSnd.played){ emptyFuelSnd.play(); emptyFuelSnd.played=true; } keys["ArrowRight"]=false; } 
    }
    if(keys["ArrowLeft"]){ 
        if(canMove){ car.vx-=0.2; fuel-=PRESS_CONSUME; } 
        else { if(!emptyFuelSnd.played){ emptyFuelSnd.play(); emptyFuelSnd.played=true; } keys["ArrowLeft"]=false; } 
    }
    if(keys[" "] && car.grounded){ 
        if(canMove){ car.vy=-10; car.grounded=false; fuel-=JUMP_COST; jumpSnd.play(); } 
        else { if(!emptyFuelSnd.played){ emptyFuelSnd.play(); emptyFuelSnd.played=true; } } 
        keys[" "]=false; 
    }

    fuel-=PASSIVE_DECAY; fuel=Math.max(0,Math.min(MAX_FUEL,fuel));

    car.vy+=gravity; car.x+=car.vx; car.y+=car.vy;
    let groundY=terrainY(car.x),targetY=groundY-40;
    car.y>targetY?(car.y=targetY,car.vy=0,car.grounded=true):car.grounded=false;
    car.angle=Math.atan2(terrainY(car.x+20)-terrainY(car.x-20),40);
    car.vx*=0.98;

    for(let b of barriers){ 
        if(car.x>b.x-30 && car.x<b.x+b.w+30){ 
            let top=b.y-b.h; 
            if(car.y>top-40){ 
                if(!crashPlayed){ crashSnd.play(); crashPlayed=true; } 
                gameOver=true; car.y=top-40; car.vy=-8; 
            } 
        } 
    }

    for(let c of coins){ 
        if(!c.collected){ 
            let dx=car.x-c.x,dy=car.y-c.y; 
            if(Math.hypot(dx,dy)<40){ c.collected=true; score+=10; coinSnd.play(); } 
        } 
    }

    for(let f of fuels){ 
        if(!f.collected){ 
            let dx=car.x-f.x,dy=car.y-f.y; 
            if(Math.hypot(dx,dy)<50){ f.collected=true; fuel=MAX_FUEL; fuelSnd.play(); } 
        } 
    }

    if(car.x<0) car.x=0;
}

function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    let camX=car.x-canvas.width*0.3;

    // Sun
    ctx.beginPath(); ctx.arc(100,100,50,0,Math.PI*2);
    let sunGrad=ctx.createRadialGradient(100,100,10,100,100,50);
    sunGrad.addColorStop(0,"#fff176"); sunGrad.addColorStop(1,"#fbc02d"); ctx.fillStyle=sunGrad; ctx.fill();

    // Terrain
    ctx.beginPath(); ctx.moveTo(terrain[0].x-camX,terrain[0].y);
    for(let t of terrain) ctx.lineTo(t.x-camX,t.y);
    ctx.lineTo(canvas.width,canvas.height); ctx.lineTo(0,canvas.height);
    ctx.fillStyle="#3caa3c"; ctx.fill();

    // Coins
    for(let c of coins){ if(c.collected) continue; let sx=c.x-camX,sy=c.y;
        if(coinImgReady) ctx.drawImage(coinImg,sx-15,sy-15,60,60);
        else{ ctx.beginPath(); ctx.arc(sx,sy,12,0,Math.PI*2); ctx.fillStyle="#d4af37"; ctx.fill(); ctx.lineWidth=2; ctx.strokeStyle="#b8860b"; ctx.stroke(); ctx.beginPath(); ctx.arc(sx,sy,5,0,Math.PI*2); ctx.fillStyle="rgba(255,255,255,0.35)"; ctx.fill(); }
    }

    // Fuel tanks
    for(let f of fuels){ if(f.collected) continue; let sx=f.x-camX,sy=f.y;
        if(fuelImgReady) ctx.drawImage(fuelImg,sx-20,sy-20,48,48);
        else{ ctx.save(); ctx.translate(sx,sy); ctx.fillStyle="#fff"; ctx.fillRect(-14,-12,28,20); ctx.fillStyle="#64dd17"; ctx.beginPath(); ctx.arc(0,-2,6,0,Math.PI*2); ctx.fill(); ctx.restore(); }
    }

    // Car
    ctx.save(); ctx.translate(car.x-camX,car.y+10); ctx.rotate(car.angle);
    if(carImgReady) ctx.drawImage(carImg,-100,-50,200,100); else { ctx.fillStyle="#ff5252"; ctx.fillRect(-60,-30,120,60); }
    ctx.restore();

    // Barriers
    ctx.fillStyle="brown"; for(let b of barriers){ let bx=b.x-camX,by=b.y; ctx.fillRect(bx,by-b.h,b.w,b.h); }

    if(gameOver){ ctx.fillStyle="rgba(0,0,0,0.6)"; ctx.fillRect(0,0,canvas.width,canvas.height); ctx.fillStyle="white"; ctx.font="60px Arial"; ctx.fillText("Game Over",canvas.width/2-150,canvas.height/2-50); ctx.font="40px Arial"; ctx.fillText("Score: "+score,canvas.width/2-100,canvas.height/2+10); ctx.fillText("Tap to Restart",canvas.width/2-150,canvas.height/2+80); }
}

canvas.addEventListener("touchstart", ()=>{if(gameOver) location.reload();});
canvas.addEventListener("mousedown", ()=>{if(gameOver) location.reload();});

function loop(){updateCar(); updateHUD(); draw(); requestAnimationFrame(loop);}
loop();
</script>
</body>
</html>s
