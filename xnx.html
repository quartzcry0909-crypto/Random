<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Flappy Bird — Fixed Pipes</title>
<style>
  html,body{height:100%;margin:0;background:#6ec6d6;display:flex;align-items:center;justify-content:center;font-family:Arial,Helvetica,sans-serif}
  #wrap{width:100%;max-width:540px;height:100%;max-height:900px;display:flex;align-items:center;justify-content:center;position:relative}
  canvas{width:100%;height:100%;display:block;background:#70c5ce}
  .hint{position:absolute;left:12px;top:12px;color:#fff;text-shadow:0 1px 0 #000;z-index:10}
  .centerMsg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:#fff;text-align:center;z-index:10}
  button{padding:8px 12px;border-radius:8px;border:0;background:#fff;cursor:pointer}
</style>
</head>
<body>
<div id="wrap">
  <div class="hint">Tap / Click / Space to flap</div>
  <div class="centerMsg" id="centerMsg">
    <h2 style="margin:0 0 8px 0">Flappy Bird</h2>
    <div style="opacity:0.9">Replace files in same folder:<br><code>This game is for educationale purpose </code></div>
    <div style="margin-top:10px"><button id="startBtn">Start / Restart</button></div>
  </div>
  <canvas id="game" width="480" height="640"></canvas>
</div>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const centerMsg = document.getElementById('centerMsg');
  const startBtn = document.getElementById('startBtn');

  const W = 480;
  const H = 640;
  canvas.width = W;
  canvas.height = H;

  const GRAV = 0.45;
  const FLAP_V = -8.5;
  const PIPE_GAP = 300;
  const PIPE_SPACING = 220;
  const PIPE_SPEED = 2.0;

  let running = false;
  let frames = 0;
  let score = 0;
  let best = 0;

  const assets = {
    bird: {src: 'fpb.png', img: new Image()},
    pipe: {src: 'pipe.png', img: new Image()},
    base: {src: 'base.png', img: new Image()},
    bg:   {src: '514WXIkKFeL.jpg', img: new Image()}
  };

  const sounds = {
    flap: new Audio('fees.mp3'),
    hit: new Audio('lose.mp3')
  };

  let fallbackUsed = { bird:false, pipe:false, base:false, bg:false };
  const bird = { x: 80, y: H/2, vy: 0, rot: 0, w: 34, h: 24, frames:1, frameIndex:0, frameTick:0 };
  let pipes = [];
  const BASE_HEIGHT_GUESS = 112;
  let baseHeight = BASE_HEIGHT_GUESS;

  function fitCanvas(){ }
  window.addEventListener('resize', fitCanvas);
  fitCanvas();

  function loadImage(entry){
    return new Promise(res => {
      const img = entry.img;
      img.onload = () => res({ok:true, entry});
      img.onerror = () => res({ok:false, entry});
      img.src = entry.src;
    });
  }

  async function loadAll(){
    const results = await Promise.all(Object.values(assets).map(loadImage));
    for(const r of results){
      const name = Object.keys(assets).find(k => assets[k] === r.entry);
      if(!r.ok) fallbackUsed[name] = true;
    }

    if(!fallbackUsed['bird']){
      const img = assets.bird.img;
      if(img.width >= img.height * 3){
        bird.frames = 3;
        bird.w = Math.round(img.width / bird.frames);
        bird.h = img.height;
      } else {
        bird.frames = 1;
        bird.w = img.width;
        bird.h = img.height;
      }
      if(bird.w > 64){
        const scale = 64 / bird.h;
        bird.h = Math.round(bird.h * scale);
        bird.w = Math.round(bird.w * scale);
      }
    }

    if(!fallbackUsed['base']) baseHeight = assets.base.img.height || BASE_HEIGHT_GUESS;

    spawnInitialPipes();
    startLoop();
  }

  function makePipe(x){
    const width = fallbackUsed['pipe'] ? 52 : (assets.pipe.img.width || 52);
    const minTop = 50;
    const maxTop = H - baseHeight - PIPE_GAP - 50;
    const top = Math.floor(Math.random() * (maxTop - minTop + 1)) + minTop;
    return { x, top, width, passed:false };
  }

  function spawnInitialPipes(){
    pipes = [];
    for(let i=0;i<3;i++) pipes.push(makePipe(W + i * PIPE_SPACING));
  }

  function onFlap(){
    if(!running){ reset(); running=true; centerMsg.style.display='none'; return; }
    bird.vy = FLAP_V;
    bird.rot = -0.6;
    if(sounds.flap){ sounds.flap.currentTime=0; sounds.flap.play().catch(()=>{}); }
  }

  canvas.addEventListener('click', onFlap);
  canvas.addEventListener('touchstart', e=>{ e.preventDefault(); onFlap(); }, {passive:false});
  window.addEventListener('keydown', e=>{ if(e.code==='Space'){ e.preventDefault(); onFlap(); } });
  startBtn.addEventListener('click', ()=>{ reset(); running=true; centerMsg.style.display='none'; });

  function rectsOverlap(ax,ay,aw,ah,bx,by,bw,bh){
    return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
  }

  function checkCollisions(){
    if(bird.y + bird.h/2 >= H - baseHeight) return true;
    for(const p of pipes){
      const topH = p.top;
      const bottomY = topH + PIPE_GAP;
      if(rectsOverlap(bird.x - bird.w/2, bird.y - bird.h/2, bird.w, bird.h, p.x, 0, p.width, topH)) return true;
      if(rectsOverlap(bird.x - bird.w/2, bird.y - bird.h/2, bird.w, bird.h, p.x, bottomY, p.width, H - bottomY - baseHeight)) return true;
    }
    return false;
  }

  function drawBackground(){
    if(!fallbackUsed['bg'] && assets.bg.img.complete) ctx.drawImage(assets.bg.img,0,0,W,H);
    else{
      const g = ctx.createLinearGradient(0,0,0,H);
      g.addColorStop(0,'#7ad0e6');
      g.addColorStop(1,'#70c5ce');
      ctx.fillStyle=g;
      ctx.fillRect(0,0,W,H);
    }
  }

  // Draw pipes using repeated texture for proper shape
  function drawPipes(){
    for(const p of pipes){
      const pipeImg = assets.pipe.img;
      if(!fallbackUsed['pipe'] && pipeImg.complete){
        // top pipe
        let y = p.top;
        while(y > 0){
          const drawHeight = Math.min(pipeImg.height, y);
          ctx.drawImage(pipeImg, 0, pipeImg.height - drawHeight, p.width, drawHeight, p.x, y - drawHeight, p.width, drawHeight);
          y -= drawHeight;
        }
        // bottom pipe
        y = p.top + PIPE_GAP;
        const bottomHeight = H - baseHeight - y;
        let drawn = 0;
        while(drawn < bottomHeight){
          const drawHeight = Math.min(pipeImg.height, bottomHeight - drawn);
          ctx.drawImage(pipeImg, 0, 0, p.width, drawHeight, p.x, y + drawn, p.width, drawHeight);
          drawn += drawHeight;
        }
      } else {
        // fallback rectangles
        ctx.fillRect(p.x,0,p.width,p.top);
        ctx.fillRect(p.x,p.top+PIPE_GAP,p.width,H-(p.top+PIPE_GAP)-baseHeight);
      }
    }
  }

  function drawBase(){
    if(!fallbackUsed['base'] && assets.base.img.complete){
      const img=assets.base.img;
      const pattern=ctx.createPattern(img,'repeat-x');
      ctx.save();
      ctx.fillStyle=pattern;
      ctx.translate(0,H-baseHeight);
      ctx.fillRect(-(frames*PIPE_SPEED)%img.width,0,W+img.width,baseHeight);
      ctx.restore();
    } else ctx.fillRect(0,H-baseHeight,W,baseHeight);
  }

  function drawBird(){
    ctx.save();
    ctx.translate(bird.x,bird.y);
    ctx.rotate(bird.rot);
    const w=bird.w,h=bird.h;
    if(!fallbackUsed['bird'] && assets.bird.img.complete){
      const img=assets.bird.img;
      if(bird.frames===1) ctx.drawImage(img,-w/2,-h/2,w,h);
      else{
        const frameW=Math.floor(img.width/bird.frames);
        ctx.drawImage(img,frameW*bird.frameIndex,0,frameW,img.height,-w/2,-h/2,w,h);
      }
    } else {
      ctx.fillStyle='#FFD700';
      ctx.beginPath(); ctx.ellipse(0,0,w/2,h/2,0,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#000';
      ctx.beginPath(); ctx.arc(w*0.08,-h*0.12,Math.max(1,w*0.06),0,Math.PI*2); ctx.fill();
    }
    ctx.restore();
  }

  function drawHUD(){
    ctx.fillStyle='#fff'; ctx.strokeStyle='#000'; ctx.lineWidth=3; ctx.font='32px Arial'; ctx.textAlign='center';
    if(running){ ctx.fillText(score,W/2,60); ctx.strokeText(score,W/2,60); }
    else if(!running && centerMsg.style.display==='none'){ ctx.fillText('Score: '+score,W/2,200); ctx.fillText('Best: '+best,W/2,240); }
  }

  function updateGame(){
    if(!running) return;
    frames++;
    bird.vy+=GRAV; bird.y+=bird.vy; bird.rot+=0.04; if(bird.rot>1.2) bird.rot=1.2;
    bird.frameTick++; if(bird.frames>1 && bird.frameTick%5===0) bird.frameIndex=(bird.frameIndex+1)%bird.frames;
    for(const p of pipes) p.x-=PIPE_SPEED;

    const last=pipes[pipes.length-1];
    if(last && last.x<W-PIPE_SPACING) pipes.push(makePipe(W));

    for(let i=pipes.length-1;i>=0;i--){
      const p=pipes[i];
      if(!p.passed && p.x+p.width<bird.x-bird.w/2){ p.passed=true; score++; if(score>best) best=score; }
      if(p.x+p.width<-50) pipes.splice(i,1);
    }

    if(checkCollisions()){
      running=false;
      centerMsg.style.display='block';
      centerMsg.querySelector('h2').textContent='Game Over';
      if(sounds.hit){ sounds.hit.currentTime=0; sounds.hit.play().catch(()=>{}); }
    }

    if(bird.y+bird.h/2>=H-baseHeight) bird.y=H-baseHeight-bird.h/2;
  }

  function drawFrame(){ drawBackground(); drawPipes(); drawBase(); drawBird(); drawHUD(); }
  function loop(){ updateGame(); drawFrame(); requestAnimationFrame(loop); }

  function reset(){ frames=0; score=0; bird.y=H/2; bird.vy=0; bird.rot=0; bird.frameIndex=0; pipes=[]; spawnInitialPipes(); centerMsg.style.display='none'; }

  function startLoop(){ centerMsg.style.display='block'; centerMsg.querySelector('h2').textContent='Flappy Bird'; loop(); }

  loadAll();
})();
</script>
</body>
</html>
