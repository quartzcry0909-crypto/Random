0<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Passkey Lock — Demo</title>
  <style>
    :root{
      --bg: #0f1724;
      --card: #0b1220;
      --accent: #06b6d4;
      --muted: #9aa6b2;
      --glass: rgba(255,255,255,0.03);
    }
    html,body{height:100%;margin:0;font-family:Inter,Segoe UI,Roboto,system-ui,-apple-system,"Helvetica Neue",Arial;}
    body{
      background: radial-gradient(1200px 600px at 10% 20%, rgba(6,182,212,0.08), transparent 8%),
                  radial-gradient(900px 500px at 90% 80%, rgba(99,102,241,0.06), transparent 10%),
                  var(--bg);
      display:flex;align-items:center;justify-content:center;color:#e6eef3;
      -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
    }

    .card{
      width:360px;max-width:92%;background:linear-gradient(180deg, rgba(255,255,255,0.02), transparent);
      border-radius:14px;padding:22px;box-shadow: 0 10px 30px rgba(2,6,23,0.7);
      border:1px solid rgba(255,255,255,0.03);
      backdrop-filter: blur(6px);
    }

    h1{font-size:20px;margin:0 0 6px 0}
    p.lead{margin:0 0 18px;color:var(--muted);font-size:13px}

    label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
    .field{margin-bottom:14px}
    input[type="text"], input[type="password"]{
      width:100%;padding:10px 12px;border-radius:10px;background:var(--glass);border:1px solid rgba(255,255,255,0.03);
      color:inherit;font-size:14px;outline:none;
    }
    .controls{display:flex;gap:8px;align-items:center}
    button{
      padding:10px 12px;border-radius:10px;border:0;background:linear-gradient(90deg,var(--accent),#7c3aed);color:#02111a;
      font-weight:600;cursor:pointer;flex:1;box-shadow: 0 6px 18px rgba(6,182,212,0.08);
    }
    button.secondary{
      background:transparent;border:1px solid rgba(255,255,255,0.04);color:var(--muted);font-weight:600;flex:0 0 auto;padding:9px 12px;
    }
    .tiny{font-size:12px;color:var(--muted);margin-top:10px}

    .status{margin-top:10px;height:20px;color:#ffd6d6;font-size:13px}
    .status.success{color:#b7ffd6}
    .user-list{margin-top:14px;font-size:13px;color:var(--muted);background:rgba(255,255,255,0.02);padding:10px;border-radius:8px}
    .toggle-pass{margin-left:8px;padding:8px;border-radius:8px;border:1px solid rgba(255,255,255,0.03);background:transparent;color:var(--muted);cursor:pointer}
    footer{margin-top:14px;color:var(--muted);font-size:12px;text-align:center}
    @media (max-width:420px){ .card{padding:16px} h1{font-size:18px} }
  </style>
</head>
<body>
  <main class="card" role="main" aria-labelledby="title">
    <h1 id="title">TEACHER DETECT LOCK</h1>
    <p class="lead">Enter your real name and passkey.</p>

    <div class="field">
      <label for="name">REAL Name</label>
      <input id="name" type="text" placeholder="e.g. Admin" autocomplete="off" />
    </div>

    <div class="field">
      <label for="pass">Passkey</label>
      <div style="display:flex; gap:8px; align-items:center;">
        <input id="pass" type="password" placeholder="your passkey" />
        <button id="toggle" class="toggle-pass" title="Show / hide">Show</button>
      </div>
    </div>

    <div class="controls">
      <button id="unlock">Unlock</button>
      <button id="clear" class="secondary" type="button">Clear</button>
    </div>

    <div class="status" id="status" aria-live="polite"></div>

    <div class="tiny">Demo users (hidden for security)</div>
    <div class="user-list" id="userList" style="display:none;"></div>

    <footer>Develop by ChudAI Team </footer>
  </main>

  <script>
    // -------------------------
    // CONFIG: user list (edit freely)
    // -------------------------
    const users = {
      "hilate_ho":   { pass: "Usha_app_r@ndi_ho", pageTitle: "Admin Panel",  pageHtml: "<h2>Welcome Admin</h2><p>Access granted to admin controls.</p>" },
      "rra":   { pass: "rr321", pageTitle: "Ra's Page", pageHtml: "<h2>Hey ra!</h2><p>Welcome to your personal area.</p>" },
      "ah":  { pass: "akh555", pageTitle: "Akh's Space", pageHtml: "<h2>Welcome Ash!</h2><p>Glad to see you here.</p>" },
      "ah":    { pass: "ah89", pageTitle: "Ah's Room", pageHtml: "<h2>Hello sh!</h2><p>This is your private room.</p>" },
      "jy":     { pass: "j000", pageTitle: "Jy's World", pageHtml: "<h2>Welcome ay!</h2><p>Enjoy your personalized page.</p>" },
      "mh":  { pass: "mah007", pageTitle: "Msh's Zone", pageHtml: "<h2>Hi Mah!</h2><p>Your zone is unlocked.</p>" },
      "yh":    { pass: "yh999", pageTitle: "Ys Portal", pageHtml: "<h2>Welcome sh!</h2><p>This is your secret portal.</p>" }
    };

    // Build visible user list (hidden for security)
    const userListEl = document.getElementById('userList');
    // keep it empty and hidden for security (do not display demo names/passkeys)
    userListEl.innerHTML = '';
    userListEl.style.display = 'none';

    // helpers
    function cap(s){ return s.charAt(0).toUpperCase() + s.slice(1); }
    function escapeHtml(str){ return String(str).replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s])); }

    // UI elements
    const nameInput = document.getElementById('name');
    const passInput = document.getElementById('pass');
    const toggleBtn = document.getElementById('toggle');
    const unlockBtn = document.getElementById('unlock');
    const clearBtn  = document.getElementById('clear');
    const statusEl  = document.getElementById('status');

    // Toggle password visibility
    toggleBtn.addEventListener('click', () => {
      if (passInput.type === 'password') {
        passInput.type = 'text';
        toggleBtn.textContent = 'Hide';
      } else {
        passInput.type = 'password';
        toggleBtn.textContent = 'Show';
      }
    });

    // Clear fields
    clearBtn.addEventListener('click', () => {
      nameInput.value = '';
      passInput.value = '';
      statusEl.textContent = '';
      passInput.type = 'password';
      toggleBtn.textContent = 'Show';
      nameInput.focus();
    });

    // Submit with Enter
    [nameInput, passInput].forEach(el => {
      el.addEventListener('keydown', (ev) => {
        if (ev.key === 'Enter') {
          ev.preventDefault();
          doUnlock();
        }
      });
    });

    // Unlock button
    unlockBtn.addEventListener('click', doUnlock);

    function doUnlock() {
      const rawName = nameInput.value.trim();
      const rawPass = passInput.value;
      if (!rawName || !rawPass) {
        setStatus("Please enter both name and passkey.", false);
        return;
      }

      const key = rawName.toLowerCase();
      if (!users.hasOwnProperty(key)) {
        setStatus("Unknown name.", false);
        return;
      }

      if (users[key].pass === rawPass) {
        setStatus("Passkey accepted. Opening your page...", true);
        openUserPage(key, users[key]);
      } else {
        setStatus("Incorrect passkey.", false);
      }
    }

    function setStatus(msg, ok) {
      statusEl.textContent = msg;
      statusEl.className = 'status ' + (ok ? 'success' : '');
    }

    // On successful login open xnx.html (must exist in same folder/server)
    function openUserPage(key, userObj) {
      // Open a static page named xnx.html
      const target = 'xnx.html';
      const newWin = window.open(target, '_blank');
      if (!newWin) {
        // fallback: navigate current tab
        location.href = target;
      } else {
        // nothing else required
      }
    }
  </script>
</body>
</html>
